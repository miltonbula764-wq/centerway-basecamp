            fi
            sleep 1
          done
          exit 1
      - name: Mission 20.2 C01 to C02 scenario on the empty database
        working-directory: ${{ runner.temp }}/cw-c02
        run: python3 e2e/c02-ingestion.py
      - name: Preserve C02 results and safe technical logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
