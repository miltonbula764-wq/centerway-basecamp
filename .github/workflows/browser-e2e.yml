name: Browser C02-C03 isolated E2E
on:
  push:
    branches: [review/c02-c03-browser-e2e]
  pull_request:
    branches: [main]
    paths: ['e2e/**', 'src/**', '.github/workflows/browser-e2e.yml']
permissions:
  contents: read
concurrency:
  group: browser-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cw_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cw_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.0'}
      - name: Stage isolated application and install frozen app dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cw-browser/e2e/logs"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/cw-browser" --exclude='.env' --exclude='.env.*'
          cd "$RUNNER_TEMP/cw-browser"
          sha256sum bun.lock package.json > e2e/logs/locked-inputs.sha256
          bun install --frozen-lockfile 2>&1 | tee e2e/logs/install.log
          sha256sum --check e2e/logs/locked-inputs.sha256
      - name: Browser toolchain lock preparation
        working-directory: ${{ runner.temp }}/cw-browser/e2e
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          python3 -c "import pathlib,base64; print('CW_BROWSER_LOCK='+base64.b64encode(pathlib.Path('package-lock.json').read_bytes()).decode())"
      - name: Start disposable real auth and database services
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        working-directory: ${{ runner.temp }}/cw-browser
        run: python3 e2e/start_backend.py
      - name: Collect safe infrastructure evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/cw-browser/e2e/logs"
          for service in cw-auth cw-rest cw-gateway; do
            docker logs "$service" > "$RUNNER_TEMP/cw-browser/e2e/logs/$service.log" 2>&1 || true
          done
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cw-browser/e2e/logs/
          retention-days: 3
          if-no-files-found: warn
      - name: Stop only this job's disposable services
        if: always()
        run: |
          docker rm -f cw-gateway cw-rest cw-auth >/dev/null 2>&1 || true
