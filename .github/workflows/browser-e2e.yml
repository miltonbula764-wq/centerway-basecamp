      - name: Remove only labelled C02 disposable resources
        if: always()
        working-directory: ${{ runner.temp }}/cw-c02
        run: python3 scripts/mvp/stop-local.py

  integrated-value:
    name: C01 to C04 / ten SaaS customers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: cw_e2e
