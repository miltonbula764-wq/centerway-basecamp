name: Browser C02-C03 isolated E2E
on:
  push:
    branches: [review/c02-c03-browser-e2e, review/core-value-context]
  pull_request:
    branches: [main]
    paths: ['e2e/**', 'supabase/**', 'src/**', 'drizzle/migrations/**', 'scripts/mvp/**', 'package.json', 'bun.lock', '*config*', '.github/workflows/browser-e2e.yml']
permissions:
  contents: read
concurrency:
  group: browser-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cw_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cw_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.0'}
      - name: Stage isolated application and install frozen app dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cw-browser/e2e/logs"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/cw-browser" --exclude='.env' --exclude='.env.*'
          cd "$RUNNER_TEMP/cw-browser"
          sha256sum bun.lock package.json > e2e/logs/locked-inputs.sha256
          bun install --frozen-lockfile 2>&1 | tee e2e/logs/install.log
          sha256sum --check e2e/logs/locked-inputs.sha256
      - name: Install locked Playwright and Chromium
        working-directory: ${{ runner.temp }}/cw-browser/e2e
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start disposable real auth and database services
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        working-directory: ${{ runner.temp }}/cw-browser
        run: python3 e2e/start_backend.py --defer-mvp-review
      - name: Seed synthetic data through real password grants and REST
        working-directory: ${{ runner.temp }}/cw-browser
        run: node e2e/seed.mjs
      - name: Mount synthetic MVP cases and explicit retrospective outcome fixtures
        working-directory: ${{ runner.temp }}/cw-browser
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: cw_e2e
          PGPASSFILE: /dev/null
        run: |
          python3 scripts/mvp/apply-review-migration.py
          node e2e/mvp-seed.mjs
          python3 scripts/mvp/load-history.py
          python3 scripts/mvp/apply-review-migration.py --c04
          python3 scripts/mvp/review-database.py
          python3 scripts/mvp/review-database.py --c04
          node e2e/operational-seed.mjs
          python3 scripts/mvp/apply-review-migration.py --operational
          python3 scripts/mvp/load-history.py --operational
          python3 scripts/mvp/review-database.py --operational
          python3 scripts/mvp/apply-review-migration.py --followup
          node e2e/followup-seed.mjs
          python3 scripts/mvp/review-database.py --followup
          python3 scripts/mvp/apply-review-migration.py --team
          node e2e/team-seed.mjs
          python3 scripts/mvp/review-database.py --team
          python3 e2e/team-concurrency.py
          python3 scripts/mvp/apply-review-migration.py --api
          python3 e2e/ingestion-api.py
          python3 scripts/mvp/apply-review-migration.py --monitoring
          python3 e2e/scheduled-reviews.py --defer-temporal
          python3 scripts/mvp/apply-review-migration.py --cycles
          python3 scripts/mvp/review-database.py --followup
          python3 e2e/operational-cycles.py
          python3 scripts/mvp/review-database.py --operational
          python3 scripts/mvp/apply-review-migration.py --responsibilities
          python3 e2e/responsibilities.py
          python3 scripts/mvp/apply-review-migration.py --onboarding
          python3 e2e/operational-onboarding.py
      - name: Synthetic scale and measured Core planner correction
        working-directory: ${{ runner.temp }}/cw-browser
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGDATABASE: cw_e2e
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PGPASSFILE: /dev/null
        run: |
          python3 e2e/reliability/scale.py --seed
          python3 e2e/reliability/plan.py --baseline
          python3 scripts/mvp/apply-review-migration.py --reliability
          python3 e2e/reliability/plan.py
          python3 e2e/scheduled-reviews.py --temporal-only
      - name: Browser end-to-end scenarios
        working-directory: ${{ runner.temp }}/cw-browser/e2e
        run: |
          set -euo pipefail
          npx playwright test 2>&1 | tee logs/browser.log
      - name: Operational scale, fault recovery and independent PostgreSQL restore
        working-directory: ${{ runner.temp }}/cw-browser
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGDATABASE: cw_e2e
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PGPASSFILE: /dev/null
        run: |
          python3 e2e/reliability/scale.py
          python3 e2e/reliability/recovery.py
          python3 e2e/reliability/restore.py
      - name: Dependency advisory audit and Drizzle tooling smoke check
        working-directory: ${{ runner.temp }}/cw-browser
        run: |
          set -euo pipefail
          bun audit --json > e2e/logs/dependency-audit.json
          bun run --bun drizzle-kit --version > e2e/logs/drizzle-tooling.log
          cd e2e
          npm audit --json --ignore-scripts > logs/e2e-dependency-audit.json
      - name: Unit regression suite, types and production build
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/cw-browser
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/ci/block-test-network.cjs" bun run test 2>&1 | tee e2e/logs/unit.log
          bun run --bun tsc --noEmit 2>&1 | tee e2e/logs/types.log
          bun run build 2>&1 | tee e2e/logs/build.log
          sha256sum --check e2e/logs/locked-inputs.sha256
      - name: Collect safe infrastructure evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/cw-browser/e2e/logs"
          for service in cw-auth cw-rest cw-gateway; do
            docker logs "$service" > "$RUNNER_TEMP/cw-browser/e2e/logs/$service.log" 2>&1 || true
          done
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cw-browser/e2e/logs/
            ${{ runner.temp }}/cw-browser/e2e/report/
            ${{ runner.temp }}/cw-browser/e2e/results/
            ${{ runner.temp }}/cw-browser/public/mvp-preview.html
          retention-days: 3
          if-no-files-found: warn
      - name: Stop only this job's disposable services
        if: always()
        run: |
          docker rm -f cw-recovery-rest cw-recovery-auth cw-recovery-db cw-gateway cw-rest cw-auth >/dev/null 2>&1 || true

  c01-continuous:
    name: C01 continuous ingestion / three synthetic clients
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: cw_e2e
      PGPASSFILE: /dev/null
      PG_CONTAINER: cw-mvp-db
      CW_LOCAL_MVP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.0'}
      - name: Stage C01 source without environment files or operational seeds
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cw-c01/e2e/logs"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/cw-c01" --exclude='.env' --exclude='.env.*'
          command -v psql
      - name: Start a fresh labelled tmpfs database and real auth
        working-directory: ${{ runner.temp }}/cw-c01
        run: |
          set -euo pipefail
          docker run -d --name cw-mvp-db --label centerway.disposable=mvp \
            -p 127.0.0.1:5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_DB=cw_e2e \
            -e POSTGRES_HOST_AUTH_METHOD=trust --tmpfs /var/lib/postgresql/data postgres:17
          for attempt in {1..60}; do
            if docker exec cw-mvp-db pg_isready -U postgres -d cw_e2e; then
              python3 e2e/start_backend.py --local-mvp
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Mission 20.1 continuous C01 scenario on the empty database
        working-directory: ${{ runner.temp }}/cw-c01
        run: python3 e2e/c01-continuous.py
      - name: Preserve C01 results and safe technical logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c01-continuous-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cw-c01/e2e/logs/
          retention-days: 3
          if-no-files-found: warn
      - name: Remove only labelled C01 disposable resources
        if: always()
        working-directory: ${{ runner.temp }}/cw-c01
        run: python3 scripts/mvp/stop-local.py

  c02-ingestion:
    name: C02 deterioration from C01 / three synthetic clients
