  core-operational:
    name: Core and C05-C10 / eight independent scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: cw_e2e
      PGPASSFILE: /dev/null
      PG_CONTAINER: cw-mvp-db
      CW_LOCAL_MVP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
