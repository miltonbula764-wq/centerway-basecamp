            -e POSTGRES_HOST_AUTH_METHOD=trust --tmpfs /var/lib/postgresql/data postgres:17
          for attempt in {1..60}; do
            if docker exec cw-mvp-db pg_isready -U postgres -d cw_e2e; then
              python3 e2e/start_backend.py --local-mvp
