      - name: Mission 20.4 C04 to Core and C05-C10 scenario on the empty database
        working-directory: ${{ runner.temp }}/cw-core
        run: python3 e2e/core-operational.py
      - name: Preserve Core operational results and safe technical logs
        if: always()
