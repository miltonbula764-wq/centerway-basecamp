name: CENTERWAY integrated backend and actual frontend transport
on:
  pull_request:
    paths: ['recovery-mvp/**', '.github/workflows/recovery-mvp-compatibility.yml']
  push:
    branches: ['recovery-mvp/work-mode-integration']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: centerway-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: All 97 existing backend checks, real PostgreSQL and HTTPS
        run: ./recovery-mvp/browser/test.sh
  chromium-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Pinned Lovable HttpTransport and controller in real Chromium
        run: bash recovery-mvp/compatibility/test.sh
