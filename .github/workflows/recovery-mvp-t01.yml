name: CENTERWAY adversarial T01 fixture (local only)
on:
  pull_request:
    paths: ['recovery-mvp/adversarial-t01/**', '.github/workflows/recovery-mvp-t01.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Preserve engines, transport, existing fixtures and frontend
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --exit-code "$BASE_SHA" HEAD -- recovery-mvp/sql recovery-mvp/tests recovery-mvp/api recovery-mvp/managed recovery-mvp/infra recovery-mvp/cloud-demo recovery-mvp/integration recovery-mvp/browser recovery-mvp/lovable-ui
      - name: T01 actual PostgreSQL 17, TLS, isolation, resume, concurrent idempotence, audit
        run: bash recovery-mvp/adversarial-t01/test.sh
  unchanged-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: recovery-mvp/lovable-ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.4'}
      - run: bun install --frozen-lockfile
      - run: env -u CW_SYNTHETIC_CREDENTIALS_FILE bun run test --maxWorkers=2
      - run: bunx tsc --noEmit
