name: Taskly M01 isolated proof

on:
  pull_request:
    branches: [centerway-3/m01-posthog-outcome-intake]
    paths:
      - '.github/workflows/centerway-m01-taskly-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    if: github.event.pull_request.number == 88 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/m01-taskly-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: taskly-m01-proof
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client dependency
        run: python -m pip install 'psycopg[binary]==3.2.13'
      - name: Read Taskly outcomes and verify M01 in disposable PostgreSQL
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$POSTHOG_PERSONAL_API_KEY" ]; then
            echo '::notice::Read-only PostHog credential required. Live proof did not run.'
            exit 0
          fi
          container=$(docker run -d -p 127.0.0.1::5432 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine)
          trap 'docker rm -f "$container" >/dev/null 2>&1' EXIT
          for i in {1..40}; do
            if docker exec "$container" sh -c 'test "$(cat /proc/1/comm)" = postgres && pg_isready -U postgres' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$container" pg_isready -U postgres
          for migration in recovery-mvp/sql/*.sql recovery-mvp/intake/001_posthog_outcome_intake.sql; do
            docker exec -i "$container" psql -X -v ON_ERROR_STOP=1 -U postgres < "$migration" >/dev/null
          done
          docker exec -i "$container" psql -X -v ON_ERROR_STOP=1 -U postgres >/dev/null <<'SQL'
          CREATE ROLE m01_taskly LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS IN ROLE centerway_api;
          INSERT INTO centerway.companies(tenant_id,name)
          VALUES ('a1000000-0000-0000-0000-000000000001','SYNTHETIC Taskly');
          INSERT INTO centerway.memberships(principal,tenant_id)
          VALUES ('m01_taskly','a1000000-0000-0000-0000-000000000001');
          SQL
          export M01_PORT=$(docker port "$container" 5432/tcp | cut -d: -f2)
          PYTHONPATH=recovery-mvp/intake python - <<'PY'
          from datetime import date, datetime, timedelta, timezone
          import json
          import os
          from posthog import IntakeError, PostHog, PostgresStore, sync

          tenant = "a1000000-0000-0000-0000-000000000001"
          first = date(2026, 11, 10)
          today = datetime.now(timezone.utc).date()
          valid_ids = {f"c{i:02}" for i in range(1, 21)}

          class TasklyProvider(PostHog):
              def fetch_day(self, day):
                  rows = super().fetch_day(day)
                  if not rows or any(row["customer"] not in valid_ids for row in rows):
                      raise IntakeError("taskly_missing_or_unexpected_group_ids")
                  return rows

          provider = TasklyProvider("us", 723763, os.environ["POSTHOG_PERSONAL_API_KEY"], "task_completed", 0)
          store = PostgresStore(f"host=127.0.0.1 port={os.environ['M01_PORT']} dbname=postgres user=m01_taskly")
          try:
              if today <= first:
                  rows = provider.fetch_day(first)
                  print(json.dumps({"partial_read_only": True, "day_utc": str(first), "rows": rows}))
              else:
                  end = first + timedelta(days=1)
                  result = sync(provider, store, tenant, first, through=end)
                  assert result["completed_days"] == 1
                  with store.psycopg.connect(store.dsn) as conn:
                      rows = conn.execute(
                          "SELECT import_id, counts FROM centerway.outcome_imports WHERE tenant_id=%s",
                          (tenant,),
                      ).fetchall()
                  assert len(rows) == 1
                  replay_id = store.append_day(tenant, provider.project, provider.event, provider.group_index, first, rows[0][1])
                  assert replay_id == str(rows[0][0])
                  with store.psycopg.connect(store.dsn) as conn:
                      assert conn.execute("SELECT count(*) FROM centerway.outcome_imports").fetchone()[0] == 1
                  print(json.dumps({"partial_read_only": False, "day_utc": str(first), "rows": rows[0][1], "replay": "passed"}))
          except IntakeError as exc:
              raise SystemExit(f"M01 Taskly proof failed: {exc}") from None
          PY

      - name: Export synthetic hourly Taskly signals for the isolated Core proof
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$POSTHOG_PERSONAL_API_KEY" || { echo 'Taskly read-only key unavailable'; exit 1; }
          python - <<'PY'
          import gzip, json, os
          from datetime import datetime, timedelta, timezone
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          CONTAS = tuple(f"c{n:02}" for n in range(1, 21))
          SINAIS = ("task_completed", "task_created", "session_started", "feature_used", "subscription_started")
          HORA = timedelta(hours=1)
          MAX_LINHAS = 24 * len(CONTAS) * len(SINAIS)

          Linha = tuple[str, str, datetime, int]


          class SemRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def ler_periodo(regiao: str, projeto: int, chave: str, inicio: datetime, fim: datetime) -> list[Linha]:
              if regiao not in {"us", "eu"} or not 0 < projeto <= 2_147_483_647:
                  raise ValueError("região ou ID do projeto PostHog inválido")
              if not chave.strip() or chave.startswith("phc_") or any(c.isspace() for c in chave):
                  raise ValueError("é necessária uma chave PostHog de leitura do projeto Taskly")
              contas = ", ".join(map(repr, CONTAS))
              sinais = ", ".join(map(repr, SINAIS))
              linhas: list[Linha] = []
              opener = build_opener(SemRedirect())
              while inicio < fim:
                  proximo = min(inicio + timedelta(days=1), fim)
                  query = f"""
                      SELECT toString(properties.company_id) AS conta, event AS tipo,
                             toStartOfHour(timestamp, 'UTC') AS hora, count(DISTINCT uuid) AS total
                      FROM events
                      WHERE timestamp >= toDateTime('{inicio:%Y-%m-%d %H:%M:%S}', 'UTC')
                        AND timestamp < toDateTime('{proximo:%Y-%m-%d %H:%M:%S}', 'UTC')
                        AND properties.testbed = true AND toString(properties.company_id) IN ({contas})
                        AND event IN ({sinais})
                      GROUP BY conta, tipo, hora
                      ORDER BY hora, conta, tipo
                      LIMIT {MAX_LINHAS + 1}
                  """
                  pedido = Request(
                      f"https://{regiao}.posthog.com/api/projects/{projeto}/query/",
                      data=json.dumps({"query": {"kind": "HogQLQuery", "query": query}}).encode(),
                      headers={"Authorization": f"Bearer {chave}", "Content-Type": "application/json"},
                  )
                  try:
                      with opener.open(pedido, timeout=30) as resposta:
                          corpo = resposta.read(1_000_001)
                  except HTTPError as e:
                      raise ValueError(f"PostHog respondeu HTTP {e.code}") from None
                  except (URLError, TimeoutError):
                      raise ValueError("a consulta ao PostHog falhou ou excedeu o tempo limite") from None
                  if len(corpo) > 1_000_000:
                      raise ValueError("resposta PostHog excede o limite")
                  resultado = json.loads(corpo)
                  linhas.extend(validar_resposta(resultado, inicio, proximo))
                  inicio = proximo
              return linhas


          def validar_resposta(resposta: dict, inicio: datetime, fim: datetime) -> list[Linha]:
              if not isinstance(resposta, dict) or resposta.get("error") or resposta.get("has_more") or resposta.get("next"):
                  raise ValueError("resposta PostHog incompleta")
              linhas = resposta.get("results")
              if not isinstance(linhas, list) or len(linhas) > MAX_LINHAS:
                  raise ValueError("resultado PostHog inválido ou truncado")
              if resposta.get("columns", ["conta", "tipo", "hora", "total"]) != ["conta", "tipo", "hora", "total"]:
                  raise ValueError("colunas PostHog inesperadas")
              vistos = set()
              dados = []
              for linha in linhas:
                  if not isinstance(linha, list) or len(linha) != 4:
                      raise ValueError("linha PostHog inválida")
                  conta, tipo, hora, total = linha
                  if conta not in CONTAS or tipo not in SINAIS or not isinstance(hora, str) or type(total) is not int or total <= 0:
                      raise ValueError("campos PostHog inválidos")
                  try:
                      bucket = datetime.fromisoformat(hora.replace("Z", "+00:00"))
                  except ValueError:
                      raise ValueError("hora PostHog inválida") from None
                  bucket = bucket.replace(tzinfo=bucket.tzinfo or timezone.utc).astimezone(timezone.utc)
                  chave = conta, tipo, bucket
                  if not inicio <= bucket < fim or bucket != bucket.replace(minute=0, second=0, microsecond=0) or chave in vistos:
                      raise ValueError("hora PostHog fora do período ou repetida")
                  vistos.add(chave)
                  dados.append((*chave, total))
              return dados



          corte = (datetime.now(timezone.utc) - timedelta(minutes=5)).replace(minute=0, second=0, microsecond=0)
          inicio = max(datetime(2026, 11, 10, tzinfo=timezone.utc), corte - timedelta(days=7))
          linhas = ler_periodo("us", 723763, os.environ["POSTHOG_PERSONAL_API_KEY"], inicio, corte)
          if not linhas:
              raise SystemExit("No Taskly events returned by PostHog")
          with gzip.open(os.environ["RUNNER_TEMP"] + "/taskly.json.gz", "wt", encoding="utf-8") as f:
              json.dump({"inicio": inicio, "corte": corte, "linhas": linhas}, f, default=str)
          print(f"Read {sum(r[3] for r in linhas)} Taskly events in {len(linhas)} aggregate rows")
          PY
          cat > "$RUNNER_TEMP/taskly.crt" <<'CERT'
