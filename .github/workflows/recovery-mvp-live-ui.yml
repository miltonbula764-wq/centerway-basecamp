name: CENTERWAY hosted frontend integration source
on:
  pull_request:
    paths: ['recovery-mvp/lovable-ui/**', '.github/workflows/recovery-mvp-live-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: recovery-mvp/lovable-ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.4'}
      - run: bun install --frozen-lockfile
      - run: bun run test --maxWorkers=2
      - run: bunx tsc --noEmit
      - run: bun run build
