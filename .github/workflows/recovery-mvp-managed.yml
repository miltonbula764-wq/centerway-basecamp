name: CENTERWAY managed PostgreSQL sessions and recovery
on:
  pull_request:
    paths: ['recovery-mvp/**', '.github/workflows/recovery-mvp-managed.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  managed-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install encryption utility
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Actual PostgreSQL sessions, concurrency, encrypted logical recovery and edge guards
        run: bash recovery-mvp/managed/test.sh
