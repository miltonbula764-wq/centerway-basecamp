name: CENTERWAY V2 sandbox
on:
  pull_request:
    paths: ['v2/**', '.github/workflows/centerway-v2.yml']
  push:
    branches: ['centerway-v2/**']
    paths: ['v2/**', '.github/workflows/centerway-v2.yml']
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verified Caddy for local proxy tests (no deployment)
        run: |
          bash infra/fetch-test-caddy.sh "$RUNNER_TEMP/cw-caddy"
          echo "CADDY_BIN=$RUNNER_TEMP/cw-caddy/caddy" >> "$GITHUB_ENV"
      - name: Validate systemd template without installation
        run: systemd-analyze verify --man=no infra/centerway-backend.service infra/production/centerway-production.service
      - name: API contract test dependency (runtime stays stdlib)
        run: python -m pip install -r tests/requirements.txt
      - name: Core and HTTP tests without external services
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Use runner Chrome without APT or browser downloads
        run: |
          centerway_chrome_bin="$(command -v google-chrome)"
          test -x "$centerway_chrome_bin"
          "$centerway_chrome_bin" --version
          echo "CHROMIUM_PATH=$centerway_chrome_bin" >> "$GITHUB_ENV"
      - name: Real mobile and desktop browser journeys
        run: npm run test:browser
      - name: Private HTTPS and Android emulation (local test certificate)
        run: npm run test:private-browser
      - name: Same-site HTTPS API CORS in a real browser (no product frontend)
        run: npm run test:cors-browser
