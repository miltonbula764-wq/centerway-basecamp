name: Frontend C02-C03 lifecycle review
on:
  push:
    branches: [review/c02-feedback-frontend, review/c03-operation-lifecycle]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - '*config*'
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
      - 'scripts/ci/block-test-network.cjs'
      - '.github/workflows/frontend-review.yml'
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Stage source without environment files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cw-frontend/logs"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/cw-frontend" --exclude='.env' --exclude='.env.*'
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/cw-frontend/logs/commit.txt"
          node --version > "$RUNNER_TEMP/cw-frontend/logs/toolchain.txt"
          bun --version >> "$RUNNER_TEMP/cw-frontend/logs/toolchain.txt"
      - name: Frozen installation
        id: install
        working-directory: ${{ runner.temp }}/cw-frontend
        run: |
          set -euo pipefail
          sha256sum bun.lock package.json > logs/locked-inputs.sha256
          bun install --frozen-lockfile 2>&1 | tee logs/install.log
          sha256sum --check logs/locked-inputs.sha256
      - name: Tests with network blocked
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/cw-frontend
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/ci/block-test-network.cjs" bun run test 2>&1 | tee logs/tests.log
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/cw-frontend
        run: |
          set -euo pipefail
          bun run --bun tsc --noEmit 2>&1 | tee logs/types.log
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/cw-frontend
        run: |
          set -euo pipefail
          bun run build 2>&1 | tee logs/build.log
      - name: Preserve frontend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cw-frontend/logs/
          retention-days: 3
          if-no-files-found: warn
