name: Independent living SaaS laboratory
on:
  pull_request:
    branches: [main]
    paths: ['living-lab/**', '.github/workflows/living-lab.yml', 'docs/ingestion-api.md']
permissions:
  contents: read
concurrency:
  group: living-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  controlled-laboratory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '${{ matrix.python }}'}
      - name: Standalone engine, durable queue, controlled HTTP and private panel
        working-directory: living-lab
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Two companies / seeded historical demonstration / controlled HTTP only
        working-directory: living-lab
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p artifacts
          python tests/demo.py > artifacts/controlled-demo.json
          cat artifacts/controlled-demo.json
      - name: Preserve aggregate evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: living-lab-${{ matrix.python }}-${{ github.run_id }}
          path: living-lab/artifacts/controlled-demo.json
          if-no-files-found: warn
          retention-days: 7
  private-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Build standalone non-root image without product dependencies
        run: |
          docker build -t living-lab:test living-lab
          docker run --rm --network none living-lab:test python -c 'from lab.web import make_server; import os; assert os.getuid()==10001'
      - name: Install browser test tooling only
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Synthetic private dashboard / desktop and mobile
        working-directory: living-lab
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tests/browser.py
      - name: Preserve synthetic panel screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: living-lab-panel-${{ github.run_id }}
          path: living-lab/artifacts/panel-*.png
          if-no-files-found: warn
          retention-days: 7
