name: CENTERWAY Gate 1 diagnostic validation (no secrets)

on:
  pull_request:
    paths:
      - '.github/workflows/recovery-mvp-neon-connectivity*.yml'
      - '.github/scripts/neon_connectivity.py'
      - '.github/scripts/tests/test_neon_connectivity.py'
      - 'GATE1_CONNECTIVITY.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser for offline contract checks
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Lint only the two diagnostic workflows (pinned actionlint)
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  %s\n' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/recovery-mvp-neon-connectivity.yml .github/workflows/recovery-mvp-neon-connectivity-ci.yml
      - name: Workflow contracts and simulated DNS/TCP security tests
        run: python3 -m unittest discover -s .github/scripts/tests -v
