name: Connected onboarding isolated validation
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'e2e/connected/**', 'drizzle/migrations/**', 'scripts/connectors/**', 'package.json', 'bun.lock', 'patches/**', '*config*', '.github/workflows/connected-onboarding.yml']
permissions:
  contents: read
concurrency:
  group: connected-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  connected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_DB: cw_e2e, POSTGRES_HOST_AUTH_METHOD: trust}
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd "pg_isready -U postgres -d cw_e2e" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.0'}
      - name: Stage source without environment files and install locked dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cw-connected/e2e/logs"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/cw-connected" --exclude='.env' --exclude='.env.*'
          cd "$RUNNER_TEMP/cw-connected"
          bun install --frozen-lockfile
          cd e2e
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: C01 outage-readiness regression
        working-directory: ${{ runner.temp }}/cw-connected
        run: python3 -m unittest discover -s e2e/connected -p 'test_*.py' -v
      - name: Start clean PostgreSQL with real GoTrue and PostgREST; apply complete migration journal
        working-directory: ${{ runner.temp }}/cw-connected
        env: {PG_CONTAINER: '${{ job.services.postgres.id }}'}
        run: python3 e2e/start_backend.py
      - name: Authenticated HTTP, OAuth mock, C01, RLS, retries, refresh and human approval contracts
        working-directory: ${{ runner.temp }}/cw-connected
        run: |
          set -euo pipefail
          bash e2e/connected/test.sh --serve > e2e/logs/connected-http.log 2>&1 &
          echo "$!" > e2e/private/connected-process.pid
          for attempt in $(seq 1 120); do
            test -f e2e/private/connected-runtime.json && exit 0
            kill -0 "$(cat e2e/private/connected-process.pid)" || { cat e2e/logs/connected-http.log; exit 1; }
            sleep 1
          done
          cat e2e/logs/connected-http.log
          exit 1
      - name: Private capability ACL and FORCE RLS
        working-directory: ${{ runner.temp }}/cw-connected
        env: {PGHOST: '127.0.0.1', PGUSER: postgres, PGDATABASE: cw_e2e}
        run: psql -X -v ON_ERROR_STOP=1 -f e2e/connected/rls.sql
      - name: Real browser login and mobile wizard with controlled OAuth provider
        working-directory: ${{ runner.temp }}/cw-connected/e2e
        run: npx playwright test --config connected/playwright.config.mjs
      - name: Preserve sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cw-connected/e2e/logs/connected-results.json
            ${{ runner.temp }}/cw-connected/e2e/logs/connected-http.log
            ${{ runner.temp }}/cw-connected/e2e/logs/backend.json
          if-no-files-found: warn
